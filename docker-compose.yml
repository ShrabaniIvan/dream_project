version: '3.8'

services:
  descriptive-stats:
    build:
      context: ./descriptive_stats
      dockerfile: Dockerfile
    container_name: descriptive-stats-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=descriptive-stats
    networks:
      - ag-stats-network

  time-series:
    build:
      context: ./time_series
      dockerfile: Dockerfile
    container_name: time-series-service
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=time-series
    networks:
      - ag-stats-network

  predictive-modeling:
    build:
      context: ./predictive_modeling
      dockerfile: Dockerfile
    container_name: predictive-modeling-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=predictive-modeling
    networks:
      - ag-stats-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard-app
    ports:
      - "8501:8501"
    environment:
      - DESCRIPTIVE_STATS_URL=http://descriptive-stats:8001
      - TIME_SERIES_URL=http://time-series:8002
      - PREDICTIVE_MODELING_URL=http://predictive-modeling:8003
    volumes:
      - ./data:/data
    depends_on:
      - descriptive-stats
      - time-series
      - predictive-modeling
    networks:
      - ag-stats-network

networks:
  ag-stats-network:
    driver: bridge
