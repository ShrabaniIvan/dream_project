[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dream-project"
version = "0.1.0"
description = "Agricultural Statistics Dashboard with AI-powered analysis summaries"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Abhijit Ghosh", email = "ivanshab23@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "streamlit==1.28.1",
    "requests==2.31.0",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "openai>=1.3.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dream_project"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 120
target-version = "py39"
